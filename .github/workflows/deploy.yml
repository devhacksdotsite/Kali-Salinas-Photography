name: Deploy Kali UGC portfolio

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-kalimaries-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload immutable assets
        run: |
          aws s3 sync dist/ s3://kalimaries.com \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "robots.txt" \
            --exclude "sitemap*.xml"

      - name: Upload HTML and crawl files
        run: |
          aws s3 sync dist/ s3://kalimaries.com \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "*" \
            --include "*.html"

          aws s3 cp dist/robots.txt s3://kalimaries.com/robots.txt \
            --cache-control "public, max-age=86400" \
            --content-type "text/plain"

          for sitemap in dist/sitemap*.xml; do
            aws s3 cp "$sitemap" "s3://kalimaries.com/$(basename "$sitemap")" \
              --cache-control "public, max-age=86400" \
              --content-type "application/xml"
          done

      - name: Upload clean route aliases
        run: |
          while IFS= read -r -d '' index; do
            route="${index#dist/}"
            route="${route%/index.html}"
            aws s3 cp "$index" "s3://kalimaries.com/$route" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --content-type "text/html"
          done < <(find dist -mindepth 2 -type f -name index.html -print0)

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E1A03TVWDXLSLN --paths '/*'
