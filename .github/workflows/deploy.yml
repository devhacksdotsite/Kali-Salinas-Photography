name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.PUBLIC_CLOUDINARY_CLOUD_NAME }}
          PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.PUBLIC_FORMSPREE_ENDPOINT }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "sitemap-*" \
            --exclude "robots.txt"

          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "sitemap-*" \
            --include "robots.txt" \
            --content-type "text/html" \
            --exclude "*" \
            --include "*.html"

          aws s3 cp dist/robots.txt s3://${{ secrets.AWS_S3_BUCKET }}/robots.txt \
            --cache-control "public, max-age=86400"

          aws s3 cp dist/sitemap-index.xml s3://${{ secrets.AWS_S3_BUCKET }}/sitemap-index.xml \
            --cache-control "public, max-age=86400" \
            --content-type "application/xml"

          aws s3 cp dist/sitemap-0.xml s3://${{ secrets.AWS_S3_BUCKET }}/sitemap-0.xml \
            --cache-control "public, max-age=86400" \
            --content-type "application/xml"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
